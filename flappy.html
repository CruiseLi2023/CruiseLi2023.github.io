
<!DOCTYPE html>
<html>
<head>
  <title>Dodge the Blocks</title>
  <style>
    body {
      background: #222;
      color: white;
      text-align: center;
      font-family: Arial;
    }
    canvas {
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>Dodge the Blocks</h1>
  <p>Use the left and right arrow keys!</p>
  <canvas id="game" width="400" height="500"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    let playerX = 180;
    let playerY = 440;
    let blockX = 100;
    let blockY = 0;
    let score = 0;
    let gameOver = false;

    document.addEventListener("keydown", function(event) {
      if (event.key === "ArrowLeft") playerX -= 20;
      if (event.key === "ArrowRight") playerX += 20;
    });

    function gameLoop() {
      if (gameOver) {
        ctx.fillStyle = "black";
        ctx.font = "30px Arial";
        ctx.fillText("Game Over!", 110, 250);
        return;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "blue";
      ctx.fillRect(playerX, playerY, 40, 40);

      ctx.fillStyle = "red";
      ctx.fillRect(blockX, blockY, 40, 40);

      blockY += 3;

      if (blockY > canvas.height) {
        blockY = 0;
        blockX = Math.random() * (canvas.width - 40);
        score++;
      }

      if (
        playerX < blockX + 40 &&
        playerX + 40 > blockX &&
        playerY < blockY + 40 &&
        playerY + 40 > blockY
      ) {
        gameOver = true;
      }

      ctx.fillStyle = "black";
      ctx.font = "20px Arial";
      ctx.fillText("Score: " + score, 10, 25);

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
